<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar — frontier feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4f5f2; --panel:#ffffff; --ink:#16191c; --muted:#5f6870;
    --line:#e3e6e1; --line-strong:#c9cec7; --accent:#2f3aa6;
    --serif:'Spectral',Georgia,serif;
    --sans:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font-family:var(--mono);cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px}
  header{border-bottom:1px solid var(--line-strong);background:var(--paper);position:sticky;top:0;z-index:5}
  .head-in{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:20px 0 14px}
  .brand .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
  .brand h1{font-family:var(--serif);font-weight:600;font-size:30px;margin:2px 0 0;letter-spacing:-.01em}
  .gen{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;white-space:nowrap;line-height:1.6}
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 0 14px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;flex:1;min-width:0}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--panel);border-radius:999px;padding:5px 11px 5px 9px;font-family:var(--mono);font-size:12px;color:var(--ink);transition:.15s}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,#999);flex:none}
  .chip[aria-pressed="false"]{color:var(--muted);background:transparent;border-style:dashed;opacity:.7}
  .chip[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-strong)}
  .chip:hover{border-color:var(--ink)}
  .spacer{flex:1}
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
  .seg button{background:var(--panel);border:0;padding:6px 12px;font-size:12px;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .refresh{border:1px solid var(--line-strong);background:var(--panel);border-radius:7px;padding:6px 13px;font-size:12px;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
  .refresh:hover{border-color:var(--ink)}
  .refresh.spin svg{animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  main{padding:22px 0 60px}
  .count{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:0 0 14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 17px;margin:0 0 12px;transition:.15s}
  .card:hover{border-color:var(--line-strong);transform:translateY(-1px);box-shadow:0 6px 22px -16px rgba(0,0,0,.35)}
  .meta{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 7px}
  .meta .src{text-transform:uppercase;letter-spacing:.05em;color:var(--ink);font-weight:500}
  .meta .tt{display:inline-flex;align-items:center;gap:5px;color:var(--c,#666)}
  .meta .tt .dot{width:7px;height:7px;border-radius:50%;background:var(--c,#666)}
  .card h2{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.28;margin:0 0 6px;letter-spacing:-.005em}
  .card h2 a{text-decoration:none}
  .card h2 a:hover{text-decoration:underline;text-underline-offset:3px}
  .card p{margin:0 0 13px;font-size:14.5px;color:#2b3036}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px dashed var(--line);padding-top:11px}
  .gauge{display:flex;align-items:center;gap:9px;min-width:0}
  .ticks{display:flex;gap:3px}
  .tick{width:20px;height:6px;border-radius:2px;background:var(--line);box-shadow:inset 0 0 0 1px var(--line-strong)}
  .tick.on{background:var(--c,#666);box-shadow:none}
  .stage{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--c,#444);white-space:nowrap}
  .sig{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
  .sig b{color:var(--ink);font-weight:500}
  .empty{border:1px dashed var(--line-strong);border-radius:12px;padding:34px 22px;text-align:center;color:var(--muted);font-size:14px}
  .empty b{color:var(--ink);font-family:var(--serif);font-weight:600;font-size:17px;display:block;margin-bottom:6px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:12px;padding:9px 15px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  footer{border-top:1px solid var(--line);padding:16px 0 40px;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.7}
  @media (max-width:560px){
    .brand h1{font-size:24px}
    .head-in{padding-top:16px}
    .tick{width:15px}
    .foot{flex-direction:column;align-items:flex-start;gap:9px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="head-in">
      <div class="brand">
        <div class="eyebrow">Research radar</div>
        <h1>Frontier feed</h1>
      </div>
      <div class="gen" id="gen"></div>
    </div>
    <div class="controls">
      <div class="chips" id="chips"></div>
      <div class="seg" role="group" aria-label="Sort">
        <button id="sortLatest" aria-pressed="true">Latest</button>
        <button id="sortTop" aria-pressed="false">Top</button>
      </div>
      <button class="refresh" id="refresh" aria-label="Refresh feed">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        Refresh
      </button>
    </div>
  </div>
</header>
<main>
  <div class="wrap">
    <p class="count" id="count"></p>
    <div id="feed"></div>
  </div>
</main>
<footer><div class="wrap" id="footer"></div></footer>
<div class="toast" id="toast"></div>

<script>
const STAGES = ["discovery","lab","prototype","commercial","scaled"];
const TOPIC_COLORS = {
  "Nuclear fusion":"#c4432b",
  "Superconductors":"#1e88a8",
  "Dark matter":"#6c4cc4",
  "Exoplanet imaging telescopes":"#2e8b6b",
  "Early life and archaea":"#b07a1e"
};
const PALETTE = ["#c4432b","#1e88a8","#6c4cc4","#2e8b6b","#b07a1e","#3341b0","#8a6d3b"];
function colorFor(t,i){return TOPIC_COLORS[t] || PALETTE[i % PALETTE.length];}

const store = (()=>{ try{ const k="__t"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return localStorage; }catch(e){ const m={}; return {getItem:k=>k in m?m[k]:null, setItem:(k,v)=>m[k]=String(v)};}})();

let DATA = null;
let unfollowed = new Set();
let sort = "latest";
try{ unfollowed = new Set(JSON.parse(store.getItem("radar.unfollowed")||"[]")); }catch(e){}
sort = store.getItem("radar.sort") || "latest";

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function relTime(iso){
  if(!iso) return "";
  const d=new Date(iso.replace(/Z?$/,"Z")); if(isNaN(d)) return "";
  const s=(Date.now()-d.getTime())/1000;
  if(s<3600) return Math.max(1,Math.round(s/60))+"m ago";
  if(s<86400) return Math.round(s/3600)+"h ago";
  if(s<86400*30) return Math.round(s/86400)+"d ago";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}
function stageIdx(s){const i=STAGES.indexOf(s);return i<0?0:i;}

function topics(){
  if(!DATA) return [];
  const set = new Set((DATA.topics)||[]);
  DATA.items.forEach(it=>set.add(it.topic));
  return [...set].filter(Boolean);
}

function renderChips(){
  const box=document.getElementById("chips"); box.innerHTML="";
  topics().forEach((t,i)=>{
    const on=!unfollowed.has(t);
    const b=document.createElement("button");
    b.className="chip"; b.setAttribute("aria-pressed",on?"true":"false");
    b.style.setProperty("--c",colorFor(t,i));
    b.innerHTML=`<span class="dot"></span>${esc(t)}`;
    b.title=on?`Following ${t} — click to unfollow`:`Click to follow ${t}`;
    b.onclick=()=>{ if(unfollowed.has(t)) unfollowed.delete(t); else unfollowed.add(t);
      store.setItem("radar.unfollowed",JSON.stringify([...unfollowed]));
      renderChips(); renderFeed(); };
    box.appendChild(b);
  });
}

function gauge(it,color){
  const idx=stageIdx(it.stage);
  let ticks=""; for(let i=0;i<5;i++) ticks+=`<span class="tick ${i<=idx?"on":""}"></span>`;
  const label=(it.stage||"").replace(/\b\w/,c=>c.toUpperCase());
  return `<div class="gauge" title="Maturity: ${esc(label)} (discovery → lab → prototype → commercial → scaled)">
      <span class="ticks" style="--c:${color}">${ticks}</span>
      <span class="stage" style="--c:${color}">${esc(it.stage||"")}</span></div>`;
}
function sig(n){
  n=Math.max(1,Math.min(5,n||1));
  let d=""; for(let i=1;i<=5;i++) d+=(i<=n?"\u25c6":"\u25c7");
  return `<span class="sig">${d} <b>${n}</b>/5</span>`;
}

function card(it,i){
  const color=colorFor(it.topic,i);
  return `<article class="card">
    <div class="meta">
      <span class="src">${esc(it.source)}</span>
      <span>${esc(relTime(it.added||it.published))}</span>
      <span class="tt" style="--c:${color}"><span class="dot"></span>${esc(it.topic)}</span>
    </div>
    <h2><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a></h2>
    <p>${esc(it.summary)}</p>
    <div class="foot">${gauge(it,color)}${sig(it.significance)}</div>
  </article>`;
}

function renderFeed(){
  const items=(DATA.items||[]).filter(it=>!unfollowed.has(it.topic));
  items.sort((a,b)=> sort==="top"
    ? (b.significance-a.significance) || ((b.added||"")<(a.added||"")?1:-1)
    : ((b.added||b.published||"")<(a.added||a.published||"")?1:-1));
  document.getElementById("count").textContent =
    `${items.length} item${items.length===1?"":"s"} · ${sort==="top"?"by significance":"newest first"}`;
  const feed=document.getElementById("feed");
  if(!items.length){
    const allOff = topics().length && topics().every(t=>unfollowed.has(t));
    feed.innerHTML=`<div class="empty"><b>${allOff?"Every topic is unfollowed":"Nothing here yet"}</b>${
      allOff?"Follow a topic above to fill the feed.":"New items appear after the next scheduled run. Hit Refresh to check."}</div>`;
    return;
  }
  feed.innerHTML=items.map(card).join("");
}

function renderMeta(){
  const g=DATA.generated?("Updated "+relTime(DATA.generated)):"Sample data";
  document.getElementById("gen").innerHTML=`${esc(g)}<br>${(DATA.items||[]).length} in archive`;
  document.getElementById("footer").innerHTML=
    `Generated ${DATA.generated?esc(new Date(DATA.generated).toLocaleString()):"— (embedded sample)"} · `+
    `sources: arXiv · PubMed · ScienceDaily · Physics World · Symmetry · Space.com · `+
    `Quanta · Scientific American · Science · Nature · Universe Today`;
}

function apply(data){ DATA=data; renderChips(); renderFeed(); renderMeta(); }

let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg;
  t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); }

async function loadFeed(isManual){
  const btn=document.getElementById("refresh"); btn.classList.add("spin");
  try{
    const res=await fetch("feed.json?ts="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const data=await res.json();
    const before=DATA?DATA.items.length:0;
    apply(data);
    if(isManual){ const d=data.items.length-before;
      toast(d>0?`Feed updated · ${d} new`:"Feed up to date"); }
  }catch(e){
    if(!DATA) apply({generated:null,topics:["Nuclear fusion","Superconductors","Dark matter","Exoplanet imaging telescopes","Early life and archaea"],items:[]});
    if(isManual) toast("Could not reach feed.json — showing sample");
  }finally{ setTimeout(()=>btn.classList.remove("spin"),400); }
}

function setSort(s){ sort=s; store.setItem("radar.sort",s);
  document.getElementById("sortLatest").setAttribute("aria-pressed",s==="latest");
  document.getElementById("sortTop").setAttribute("aria-pressed",s==="top");
  renderFeed(); }

document.getElementById("sortLatest").onclick=()=>setSort("latest");
document.getElementById("sortTop").onclick=()=>setSort("top");
document.getElementById("refresh").onclick=()=>loadFeed(true);
setSort(sort);
loadFeed(false);
</script>
</body>
</html>
