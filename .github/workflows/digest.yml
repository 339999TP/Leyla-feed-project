name: research-radar

# Free scheduler. Runs Mondays 07:00 UTC. Cron: minute hour dom month dow
# Daily 07:00 -> "0 7 * * *"   |   Weekdays -> "0 7 * * 1-5"
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:         # manual "Run workflow" button in the Actions tab
    inputs:
      topic:
        description: "Add a new topic (Claude generates keywords + sources, then seeds the feed). Leave blank for a normal run."
        required: false
        default: ""

permissions:
  contents: write            # lets the job commit the updated feed.json

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Carry the seen-store between runs so "new" stays meaningful.
      - name: Restore seen-store
        uses: actions/cache@v4
        with:
          path: radar_seen.sqlite
          key: radar-seen-${{ github.run_id }}
          restore-keys: radar-seen-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run digest
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          # Passed via env (not interpolated into the shell) to avoid injection.
          ADD_TOPIC: ${{ github.event.inputs.topic }}
        run: |
          if [ -n "$ADD_TOPIC" ]; then
            echo "Adding topic: $ADD_TOPIC"
            python radar.py --config config.yaml --add-topic "$ADD_TOPIC"
          else
            python radar.py --config config.yaml
          fi

      - name: Commit feed
        env:
          ADD_TOPIC: ${{ github.event.inputs.topic }}
        run: |
          git config user.name  radar-bot
          git config user.email radar-bot@users.noreply.github.com
          # config.yaml is committed too, so a newly added topic persists.
          git add docs/feed.json radar_seen.sqlite config.yaml || true
          if [ -n "$ADD_TOPIC" ]; then
            MSG="add topic: $ADD_TOPIC ($(date -u +%FT%H:%MZ))"
          else
            MSG="feed $(date -u +%FT%H:%MZ)"
          fi
          git commit -m "$MSG" || echo "nothing to commit"
          git push || echo "push skipped"
