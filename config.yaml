# ---------------------------------------------------------------------------
# research-radar config. Copy to config.yaml and edit.
# ---------------------------------------------------------------------------

# How far back each run looks. Match to how often you schedule it:
# weekly run -> 7, daily -> 1. The seen-store stops repeats regardless.
lookback_days: 7

# Only send items to the LLM if they contain a topic keyword first.
# true = cheaper + tighter; false = catches more, costs more LLM calls.
keyword_prefilter: true

max_per_source: 60

llm:
  provider: anthropic     # mock | anthropic | openai | gemini
  model: claude-haiku-4-5 # cheapest Claude; fine for triage. Sonnet = claude-sonnet-5
  batch_size: 10
  # API key is read from the LLM_API_KEY environment variable, never stored here.

delivery:
  site_dir: ./docs        # feed.json is written here, next to index.html
  email:
    enabled: false
    smtp_host: smtp.gmail.com
    smtp_port: 587
    username: you@example.com
    from_addr: you@example.com
    to_addrs: [you@example.com]
    # password is read from the EMAIL_PASSWORD environment variable.

# --- SOURCES: curated for genuine breakthroughs and discovery announcements ---
# Combines news (fast announcements) + arXiv (landmark papers only, heavily filtered by Claude)
# arXiv disabled for routine papers; enabled for high-impact categories only.
sources:
  arxiv_categories:       # Only categories likely to have landmark results
    - physics.plasm-ph    # fusion / plasma — lots of milestone announcements
    - cond-mat.supr-con   # superconductors — high-visibility breakthroughs
    - astro-ph.EP         # exoplanets — direct imaging, discovery announcements

  pubmed_queries: []      # Disabled: biology breakthroughs announced in news first

  rss:                    # Curated sources that announce actual discoveries & events
    # Major journals: announce breakthroughs *and* accept confirmed results
    - https://www.nature.com/nature.rss
    - https://www.science.org/rss/news_current.xml

    # Science journalism & news (strong editorial filter for real breakthroughs)
    - https://www.sciencedaily.com/rss/matter_energy/physics.xml
    - https://www.sciencedaily.com/rss/matter_energy/nuclear_energy.xml
    - https://www.sciencedaily.com/rss/space_time/dark_matter.xml
    - https://www.sciencedaily.com/rss/space_time/extrasolar_planets.xml
    - https://www.sciencedaily.com/rss/fossils_ruins/origin_of_life.xml
    - https://www.quantamagazine.org/feed/
    - https://www.scientificamerican.com/platform/syndication/rss/

    # Astronomy: first light, landings, direct discoveries
    - https://www.space.com/feeds/all
    - https://www.universetoday.com/feed/

    # Physics breakthroughs, milestones, demonstrations
    - https://physicsworld.com/feed/
    - https://www.symmetrymagazine.org/feed

# --- TOPICS: what you care about + your thresholds. ---
# min_stage: discovery | lab | prototype | commercial | scaled
# min_significance: 1 (incremental) .. 5 (field-shifting)
# Set to breakthroughs/events only: min_significance 4 means just landmark results
# and concrete events (probe landings, first light, first detections, records).
# min_stage stays "discovery" so a major DISCOVERY (e.g. a room-temp superconductor)
# still passes; significance is the lever doing the tightening, not stage.
topics:
  - name: Nuclear fusion
    description: Progress in fusion energy - tokamaks, stellarators, inertial confinement, net energy gain, and reactor engineering.
    keywords: [nuclear fusion, fusion energy, fusion reactor, tokamak, stellarator, plasma confinement, inertial confinement, ignition, net energy gain]
    min_stage: discovery
    min_significance: 4

  - name: Superconductors
    description: New superconducting materials and mechanisms, especially higher critical temperatures and room-temperature claims.
    keywords: [superconductor, superconducting, superconductivity, critical temperature, room-temperature superconductor, Cooper pair, Meissner effect]
    min_stage: discovery
    min_significance: 4

  - name: Dark matter
    description: Dark matter detection and theory - direct/indirect detection, axions, WIMPs, and candidate constraints.
    keywords: [dark matter, dark matter detection, axion, WIMP, direct detection, dark matter halo, self-interacting dark matter]
    min_stage: discovery
    min_significance: 4

  - name: Exoplanet imaging telescopes
    description: Direct imaging of exoplanets and the instruments that enable it - coronagraphs, ELTs, space telescopes, starshades.
    keywords: [exoplanet, direct imaging, coronagraph, high-contrast imaging, extremely large telescope, habitable worlds observatory, starshade]
    min_stage: discovery
    min_significance: 4

  - name: Early life and archaea
    description: Origin of life and the biology/evolution of archaea - LUCA, prebiotic chemistry, extremophiles, deep phylogeny.
    keywords: [archaea, archaeon, origin of life, abiogenesis, last universal common ancestor, LUCA, prebiotic chemistry, extremophile, hydrothermal vent]
    min_stage: discovery
    min_significance: 4
