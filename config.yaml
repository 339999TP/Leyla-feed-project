    # Make sure the feed is from a reputable source and publishes science breakthroughs

# --- TOPICS: Define what you care about! ---
# Add custom topics to track. For each topic:
#   name: Display name (shown in the feed)
#   description: What this topic covers
#   keywords: Keywords to match in titles/abstracts (comma-separated)
#   min_stage: Minimum maturity (discovery|lab|prototype|commercial|scaled)
#   min_significance: Minimum score (1-5): 1=incremental, 5=landmark
#
# Example custom topic:
#   - name: Quantum Computing
#     description: Quantum computer hardware, algorithms, and error correction
#     keywords: [quantum computing, quantum computer, quantum algorithm, qubit, quantum error correction]
#     min_stage: discovery
#     min_significance: 3

topics:
  - name: Nuclear fusion
    description: Fusion energy breakthroughs - tokamaks, stellarators, inertial confinement, net energy gain
    keywords: [nuclear fusion, fusion energy, fusion reactor, tokamak, stellarator, plasma confinement, inertial confinement, ignition, net energy gain]
    min_stage: discovery
    min_significance: 3

  - name: Superconductors
    description: Novel superconducting materials and mechanisms - higher Tc, room-temperature claims
    keywords: [superconductor, superconducting, superconductivity, critical temperature, room-temperature, Cooper pair, Meissner effect]
    min_stage: discovery
    min_significance: 3

  - name: Dark matter
    description: Direct/indirect dark matter detection, axions, WIMPs, observational constraints
    keywords: [dark matter, dark matter detection, axion, WIMP, direct detection, dark matter halo, self-interacting dark matter]
    min_stage: discovery
    min_significance: 3

  - name: Exoplanet imaging telescopes
    description: Direct imaging of exoplanets - coronagraphs, ELTs, space telescopes, starshades
    keywords: [exoplanet, direct imaging, coronagraph, high-contrast imaging, extremely large telescope, habitable worlds observatory, starshade, Roman telescope, JWST, exoplanet atmosphere, biosignature, protoplanetary disk, planet formation]
    min_stage: discovery
    min_significance: 3

  - name: Early life and archaea
    description: Origin of life, archaea evolution, LUCA, prebiotic chemistry, extremophiles
    keywords: [archaea, archaeon, origin of life, abiogenesis, last universal common ancestor, LUCA, prebiotic chemistry, extremophile, hydrothermal vent, early life, ancient life, microbial fossil, methanogen, Asgard archaea, eukaryogenesis, early Earth]
    min_stage: discovery
    min_significance: 3

  # CUSTOMIZE: Add your own topics below!
