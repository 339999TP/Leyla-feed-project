# ---------------------------------------------------------------------------
# research-radar config. Copy to config.yaml and edit.
#
# To add custom topics or sources, edit this file and re-run the pipeline.
# For GitHub Actions (automatic runs), your changes will deploy automatically
# on the next scheduled run or when triggered manually from the Actions tab.
# ---------------------------------------------------------------------------

# How far back each run looks. Match to how often you schedule it:
# weekly run -> 7, daily -> 1. The seen-store stops repeats regardless.
lookback_days: 7

# Only send items to the LLM if they contain a topic keyword first.
# true = cheaper + tighter; false = catches more, costs more LLM calls.
keyword_prefilter: true

max_per_source: 60

llm:
  provider: anthropic     # mock | anthropic | openai | gemini
  model: claude-haiku-4-5 # cheapest Claude; fine for triage. Sonnet = claude-sonnet-5
  batch_size: 10
  # API key is read from the LLM_API_KEY environment variable, never stored here.

delivery:
  site_dir: ./docs        # feed.json is written here, next to index.html
  email:
    enabled: false
    smtp_host: smtp.gmail.com
    smtp_port: 587
    username: you@example.com
    from_addr: you@example.com
    to_addrs: [you@example.com]
    # password is read from the EMAIL_PASSWORD environment variable.

# --- SOURCES: Add your own RSS feeds here! ---
# Sources can be: arXiv categories, PubMed queries, or RSS feed URLs
# Quality comes from trusted sources. Add mainstream news & academic sources only.
sources:
  arxiv_categories:       # https://arxiv.org/category_taxonomy
    - physics.plasm-ph    # fusion / plasma
    - cond-mat.supr-con   # superconductors
    - astro-ph.EP         # exoplanets
    # Add more arXiv categories above for additional topics
    # Examples: astro-ph.CO (dark matter), q-bio.PE (evolution), hep-ph (particle physics)

  pubmed_queries: []      # Disabled by default; add queries if you want biology/medical breakthroughs
    # Examples:
    # - "CRISPR gene editing breakthrough"
    # - "cancer immunotherapy"

  rss:                    # Add any mainstream science/news RSS feeds here
    # Major journals
    - https://www.nature.com/nature.rss
    - https://www.science.org/rss/news_current.xml

    # Science news & journalism
    - https://www.sciencedaily.com/rss/matter_energy/physics.xml
    - https://www.sciencedaily.com/rss/matter_energy/nuclear_energy.xml
    - https://www.sciencedaily.com/rss/space_time/dark_matter.xml
    - https://www.sciencedaily.com/rss/space_time/extrasolar_planets.xml
    - https://www.sciencedaily.com/rss/fossils_ruins/origin_of_life.xml
    - https://www.quantamagazine.org/feed/
    - https://www.scientificamerican.com/platform/syndication/rss/
    - https://www.space.com/feeds/all
    - https://www.universetoday.com/feed/
    - https://physicsworld.com/feed/
    - https://www.symmetrymagazine.org/feed

    # Add your own RSS feeds here! Examples:
    # - https://www.example.com/science/rss  (must be valid RSS)
    # - https://news.example.org/physics/feed.xml
    # Make sure the feed is from a reputable source and publishes science breakthroughs

# --- TOPICS: Define what you care about! ---
# Add custom topics to track. For each topic:
#   name: Display name (shown in the feed)
#   description: What this topic covers
#   keywords: Keywords to match in titles/abstracts (comma-separated)
#   min_stage: Minimum maturity (discovery|lab|prototype|commercial|scaled)
#   min_significance: Minimum score (1-5): 1=incremental, 5=landmark
#
# Example custom topic:
#   - name: Quantum Computing
#     description: Quantum computer hardware, algorithms, and error correction
#     keywords: [quantum computing, quantum computer, quantum algorithm, qubit, quantum error correction]
#     min_stage: discovery
#     min_significance: 3

topics:
  - name: Nuclear fusion
    description: Fusion energy breakthroughs - tokamaks, stellarators, inertial confinement, net energy gain
    keywords: [nuclear fusion, fusion energy, fusion reactor, tokamak, stellarator, plasma confinement, inertial confinement, ignition, net energy gain]
    min_stage: discovery
    min_significance: 3

  - name: Superconductors
    description: Novel superconducting materials and mechanisms - higher Tc, room-temperature claims
    keywords: [superconductor, superconducting, superconductivity, critical temperature, room-temperature, Cooper pair, Meissner effect]
    min_stage: discovery
    min_significance: 3

  - name: Dark matter
    description: Direct/indirect dark matter detection, axions, WIMPs, observational constraints
    keywords: [dark matter, dark matter detection, axion, WIMP, direct detection, dark matter halo, self-interacting dark matter]
    min_stage: discovery
    min_significance: 3

  - name: Exoplanet imaging telescopes
    description: Direct imaging of exoplanets - coronagraphs, ELTs, space telescopes, starshades
    keywords: [exoplanet, direct imaging, coronagraph, high-contrast imaging, extremely large telescope, habitable worlds observatory, starshade, Roman telescope]
    min_stage: discovery
    min_significance: 3

  - name: Early life and archaea
    description: Origin of life, archaea evolution, LUCA, prebiotic chemistry, extremophiles
    keywords: [archaea, archaeon, origin of life, abiogenesis, last universal common ancestor, LUCA, prebiotic chemistry, extremophile, hydrothermal vent]
    min_stage: discovery
    min_significance: 3

  # CUSTOMIZE: Add your own topics below!
  # - name: Quantum Computing
  #   description: Quantum computers, qubits, algorithms, error correction
  #   keywords: [quantum computing, quantum computer, quantum algorithm, qubit, quantum error]
  #   min_stage: discovery
  #   min_significance: 3
