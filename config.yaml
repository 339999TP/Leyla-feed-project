# --- TOPICS: Define what you care about! ---
# Add custom topics to track. For each topic:
#   name: Display name (shown in the feed)
#   description: What this topic covers
#   keywords: Keywords to match in titles/abstracts (comma-separated)
#   min_stage: Minimum maturity (discovery|lab|prototype|commercial|scaled)
#   min_significance: Minimum score (1-5): 1=incremental, 5=landmark
#
# Example custom topic:
#   - name: Quantum Computing
#     description: Quantum computer hardware, algorithms, and error correction
#     keywords: [quantum computing, quantum computer, quantum algorithm, qubit, quantum error correction]
#     min_stage: discovery
#     min_significance: 3

topics:
  - name: Nuclear fusion
    description: Fusion energy breakthroughs - tokamaks, stellarators, inertial confinement, net energy gain
    keywords: [nuclear fusion, fusion energy, fusion reactor, tokamak, stellarator, plasma confinement, inertial confinement, ignition, net energy gain]
    min_stage: discovery
    min_significance: 3

  - name: Superconductors
    description: Novel superconducting materials and mechanisms - higher Tc, room-temperature claims
    keywords: [superconductor, superconducting, superconductivity, critical temperature, room-temperature, Cooper pair, Meissner effect]
    min_stage: discovery
    min_significance: 3

  - name: Dark matter
    description: Direct/indirect dark matter detection, axions, WIMPs, observational constraints
    keywords: [dark matter, dark matter detection, axion, WIMP, direct detection, dark matter halo, self-interacting dark matter]
    min_stage: discovery
    min_significance: 3

  - name: Exoplanet imaging telescopes
    description: Direct imaging of exoplanets - coronagraphs, ELTs, space telescopes, starshades
    keywords: [exoplanet, direct imaging, coronagraph, high-contrast imaging, extremely large telescope, habitable worlds observatory, starshade, Roman telescope, JWST, exoplanet atmosphere, biosignature, protoplanetary disk, planet formation]
    min_stage: discovery
    min_significance: 3

  - name: Early life and archaea
    description: >
      Origin of life, archaea evolution, LUCA, prebiotic chemistry, extremophiles.
      Example of what to surface: the discovery of Asgard/Lokiarchaeota at Loki's
      Castle (a deep-sea hydrothermal vent field) that reshaped the tree of life
      and the story of how complex cells arose.
    keywords: [archaea, archaeon, origin of life, abiogenesis, last universal common ancestor, LUCA, prebiotic chemistry, extremophile, hydrothermal vent, early life, ancient life, microbial fossil, methanogen, Asgard archaea, Lokiarchaeota, Loki's Castle, eukaryogenesis, early Earth]
    min_stage: discovery
    min_significance: 2
    lookback_days: 90       # sparse topic: reach further back to build depth

  # --- MILESTONE-ONLY WATCHES ---
  # Specific missions/instruments where you ONLY want to hear when a concrete
  # milestone is hit (launch, arrival, first light, first data/detection, records)
  # -- NOT routine progress updates, funding news, or background articles.
  # These carry milestone_only: true and a high significance bar.
  - name: Europa mission
    description: >
      NASA's Europa Clipper (and related Europa exploration). Milestone watch only:
      launch, Jupiter arrival / orbit insertion, Europa flybys, instrument first
      data, and any detection of water plumes, subsurface ocean, or habitability
      signs. Ignore routine mission-status updates.
    keywords: [Europa Clipper, Europa mission, Europa flyby, Europa plume, Jupiter Icy Moons, JUICE, Europa ocean, Europa lander]
    milestone_only: true
    min_stage: discovery
    min_significance: 4
    lookback_days: 180      # milestones are rare: catch a recent one

  - name: Hyper-Kamiokande
    description: >
      Hyper-Kamiokande, Japan's next-generation neutrino observatory. Milestone
      watch only: construction completion, tank filling, first light, first neutrino
      detection, and any proton-decay or neutrino result. Ignore routine build updates.
    keywords: [Hyper-Kamiokande, Hyper-K, Hyperkamiokande, next-generation neutrino detector]
    milestone_only: true
    min_stage: discovery
    min_significance: 4
    lookback_days: 180      # milestones are rare: catch a recent one

  - name: Extremely Large Telescope
    description: >
      ESO's Extremely Large Telescope (ELT) at Cerro Armazones, Chile. Milestone
      watch only: dome completion, primary mirror installation, first light, and
      first science images/results. Ignore routine construction progress reports.
    keywords: [Extremely Large Telescope, ELT first light, ESO ELT, Cerro Armazones, world's largest telescope, ELT dome, ELT mirror]
    milestone_only: true
    min_stage: discovery
    min_significance: 4
    lookback_days: 180      # milestones are rare: catch a recent one

