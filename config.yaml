# ---------------------------------------------------------------------------
# research-radar config. Copy to config.yaml and edit.
#
# To add custom topics or sources, edit this file and re-run the pipeline.
# For GitHub Actions (automatic runs), your changes will deploy automatically
# on the next scheduled run or when triggered manually from the Actions tab.
# ---------------------------------------------------------------------------

# How far back each run looks. Match to how often you schedule it:
# weekly run -> 7, daily -> 1. The seen-store stops repeats regardless.
lookback_days: 7

# Only send items to the LLM if they contain a topic keyword first.
# true = cheaper + tighter; false = catches more, costs more LLM calls.
keyword_prefilter: true

max_per_source: 150

# Feed retention. Old cards age out after retention_days -- but only inside a
# topic that still has at least keep_min cards, so a sparse topic never empties.
# The newest keep_min cards in each topic are always kept regardless of age.
# retention_days: 0 = keep everything forever.
feed:
  retention_days: 60
  keep_min: 5

llm:
  provider: anthropic     # mock | anthropic | openai | gemini
  model: claude-haiku-4-5-20251001 # cheapest Claude; fine for triage. Sonnet = claude-sonnet-4-5
  batch_size: 10
  # API key is read from the LLM_API_KEY environment variable, never stored here.

delivery:
  site_dir: ./docs        # feed.json is written here, next to index.html
  email:
    enabled: false          # true = email the full digest every run
    smtp_host: smtp.gmail.com
    smtp_port: 587
    username: you@example.com
    from_addr: you@example.com
    to_addrs: [you@example.com]
    # password is read from the EMAIL_PASSWORD environment variable.
    #
    # BREAKTHROUGH ALERTS: fire an email the moment a truly massive result lands,
    # even if the regular digest email above is disabled. Set the score at/above
    # which to alert (5 = landmark only; 4 = also major milestones). Comment out
    # or remove to turn alerts off. Requires the EMAIL_PASSWORD secret + a real
    # SMTP host/username/to_addrs above.
    alert_significance: 5
    # alert_to_addrs: [you@example.com]   # optional; defaults to to_addrs

# --- SOURCES: Add your own RSS feeds here! ---
# Sources can be: arXiv categories, PubMed queries, or RSS feed URLs
# Quality comes from trusted sources. Add mainstream news & academic sources only.
sources:
  arxiv_categories:       # https://arxiv.org/category_taxonomy
    - physics.plasm-ph    # fusion / plasma
    - cond-mat.supr-con   # superconductors
    - astro-ph.EP         # exoplanets
    - astro-ph.IM         # astronomical instrumentation (imaging telescopes)
    - q-bio.PE            # populations & evolution (early life / archaea)
    # Add more arXiv categories above for additional topics
    # Examples: astro-ph.CO (dark matter), q-bio.PE (evolution), hep-ph (particle physics)

  pubmed_queries:         # Biology coverage (esp. early life / archaea, which RSS barely covers)
    - "archaea evolution"
    - "origin of life"
    - "last universal common ancestor"
    - "prebiotic chemistry"
    - "Asgard archaea"

  rss:                    # Add any mainstream science/news RSS feeds here
    # Top-tier journals & research
    - https://www.nature.com/nature.rss
    - https://www.nature.com/articles/index.rss
    - https://www.science.org/rss/news_current.xml
    - https://www.science.org/rss/research.xml

    # Dedicated science news outlets
    - https://www.quantamagazine.org/feed/
    - https://www.scientificamerican.com/platform/syndication/rss/
    - https://www.space.com/feeds/all
    - https://www.universetoday.com/feed/
    - https://physicsworld.com/feed/
    - https://www.symmetrymagazine.org/feed
    - https://www.eurekalert.org/rss.xml

    # Broad science coverage (ScienceDaily categories)
    - https://www.sciencedaily.com/rss/all.xml
    - https://www.sciencedaily.com/rss/matter_energy/physics.xml
    - https://www.sciencedaily.com/rss/matter_energy/nuclear_energy.xml
    - https://www.sciencedaily.com/rss/matter_energy/materials_science.xml
    - https://www.sciencedaily.com/rss/space_time/dark_matter.xml
    - https://www.sciencedaily.com/rss/space_time/extrasolar_planets.xml
    - https://www.sciencedaily.com/rss/space_time/astronomy.xml
    - https://www.sciencedaily.com/rss/fossils_ruins/origin_of_life.xml

    # Tech & science journalism
    - https://arstechnica.com/feed/
